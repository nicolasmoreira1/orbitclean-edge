<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Fundo espacial -->
  <rect width="400" height="400" fill="#0b132b"/>
  <!-- Órbitas -->
  <ellipse cx="200" cy="200" rx="160" ry="60" stroke="#00d4ff" stroke-width="1" stroke-dasharray="8 5" opacity="0.3"/>
  <ellipse cx="200" cy="200" rx="120" ry="45" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.2"/>
  <!-- Terra (círculo central) -->
  <circle cx="200" cy="200" r="55" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="200" r="55" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Continente simplificado -->
  <path d="M185 178 Q192 170 202 175 Q212 168 218 178 Q224 188 216 196 Q208 202 198 198 Q188 194 185 178Z" fill="#00d4ff" opacity="0.3"/>
  <!-- Satélite principal -->
  <rect x="270" y="148" width="36" height="14" rx="3" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Painéis solares -->
  <rect x="248" y="150" width="20" height="10" rx="1" fill="#00d4ff" opacity="0.5" stroke="#00d4ff" stroke-width="1"/>
  <rect x="308" y="150" width="20" height="10" rx="1" fill="#00d4ff" opacity="0.5" stroke="#00d4ff" stroke-width="1"/>
  <!-- Linhas dos painéis -->
  <line x1="253" y1="150" x2="253" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="258" y1="150" x2="258" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="263" y1="150" x2="263" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="313" y1="150" x2="313" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="318" y1="150" x2="318" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="323" y1="150" x2="323" y2="160" stroke="#00d4ff" stroke-width="0.5" opacity="0.7"/>
  <!-- Antena -->
  <line x1="288" y1="148" x2="285" y2="138" stroke="#00d4ff" stroke-width="1.2"/>
  <circle cx="285" cy="136" r="2" fill="#00d4ff"/>
  <!-- Detrito 1 -->
  <polygon points="88,108 96,102 100,112 92,116" stroke="#ff4d00" stroke-width="1.2" fill="#ff4d0022"/>
  <!-- Detrito 2 -->
  <polygon points="310,280 318,275 322,283 314,288" stroke="#ff4d00" stroke-width="1" fill="#ff4d0015" opacity="0.7"/>
  <!-- Detrito 3 -->
  <rect x="140" y="68" width="8" height="8" transform="rotate(30 144 72)" stroke="#ff4d00" stroke-width="1" fill="#ff4d0015" opacity="0.5"/>
  <!-- Estrelas -->
  <circle cx="30"  cy="40"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="80"  cy="20"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="350" cy="50"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="370" cy="120" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="20"  cy="200" r="1"   fill="white" opacity="0.5"/>
  <circle cx="380" cy="300" r="1"   fill="white" opacity="0.6"/>
  <circle cx="60"  cy="350" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="340" cy="370" r="1"   fill="white" opacity="0.5"/>
  <!-- Glow no satélite -->
  <circle cx="288" cy="155" r="28" fill="#00d4ff" opacity="0.04"/>
  <!-- Vetor de evasão (seta) -->
  <line x1="288" y1="148" x2="308" y2="118" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <polygon points="308,118 302,126 314,124" fill="#00d4ff" opacity="0.7"/>
  <!-- Label EVASÃO -->
  <text x="312" y="114" font-family="monospace" font-size="9" fill="#00d4ff" opacity="0.8">EVASÃO</text>
</svg>
