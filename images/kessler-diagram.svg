<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" fill="#0b132b"/>
  <!-- Grid -->
  <line x1="50" y1="20"  x2="50"  y2="240" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="240" x2="380" y2="240" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="180" x2="380" y2="180" stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="50" y1="120" x2="380" y2="120" stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="50" y1="60"  x2="380" y2="60"  stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="133" y1="20" x2="133" y2="240" stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="215" y1="20" x2="215" y2="240" stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="298" y1="20" x2="298" y2="240" stroke="#00d4ff" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 3"/>
  <!-- Curva exponencial N(t) = N0 * e^(kt) -->
  <path d="M50,230 C80,228 110,224 133,218 C160,210 185,196 215,172 C245,148 270,112 298,72 C318,46 340,32 370,24"
        stroke="#ff4d00" stroke-width="2.5" fill="none"/>
  <!-- Área sob a curva -->
  <path d="M50,230 C80,228 110,224 133,218 C160,210 185,196 215,172 C245,148 270,112 298,72 C318,46 340,32 370,24 L370,240 L50,240Z"
        fill="#ff4d00" opacity="0.06"/>
  <!-- Eixos labels -->
  <text x="190" y="270" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.7" text-anchor="middle">Anos (t)</text>
  <text x="16" y="140" font-family="monospace" font-size="10" fill="#00d4ff" opacity="0.7" transform="rotate(-90 16 140)">Detritos N(t)</text>
  <!-- Título da fórmula -->
  <text x="200" y="14" font-family="monospace" font-size="11" fill="#ff4d00" opacity="0.9" text-anchor="middle">N(t) = N₀ · eᵏᵗ — Síndrome de Kessler</text>
  <!-- Ponto crítico -->
  <circle cx="298" cy="72" r="5" fill="#ff4d00" opacity="0.9"/>
  <line x1="298" y1="72" x2="298" y2="240" stroke="#ff4d00" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="300" y="68" font-family="monospace" font-size="9" fill="#ff4d00" opacity="0.9">CRÍTICO</text>
  <!-- Legenda -->
  <rect x="55" y="35" width="10" height="3" fill="#ff4d00"/>
  <text x="70" y="42" font-family="monospace" font-size="9" fill="#a8c4e0">Crescimento sem intervenção</text>
</svg>
