<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0b132b"/>
  <!-- Conexões mesh (linhas) -->
  <line x1="200" y1="60"  x2="80"  y2="160" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="60"  x2="320" y2="160" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="80"  y1="160" x2="320" y2="160" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="80"  y1="160" x2="140" y2="250" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="320" y1="160" x2="260" y2="250" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="250" x2="260" y2="250" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="60"  x2="140" y2="250" stroke="#00d4ff" stroke-width="0.6" stroke-dasharray="4 3" opacity="0.25"/>
  <line x1="200" y1="60"  x2="260" y2="250" stroke="#00d4ff" stroke-width="0.6" stroke-dasharray="4 3" opacity="0.25"/>
  <line x1="80"  y1="160" x2="260" y2="250" stroke="#00d4ff" stroke-width="0.6" stroke-dasharray="4 3" opacity="0.2"/>
  <line x1="320" y1="160" x2="140" y2="250" stroke="#00d4ff" stroke-width="0.6" stroke-dasharray="4 3" opacity="0.2"/>
  <!-- Satélite central (ativo/evasão) — glow -->
  <circle cx="200" cy="60" r="22" fill="#00d4ff" opacity="0.08"/>
  <!-- Satélites -->
  <!-- Topo (central) -->
  <rect x="188" y="50" width="24" height="10" rx="2" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="178" y="52" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.5"/>
  <rect x="213" y="52" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="200" cy="55" r="2" fill="#00d4ff"/>
  <!-- Esquerda -->
  <rect x="68"  y="153" width="24" height="10" rx="2" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.2"/>
  <rect x="58"  y="155" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="93"  y="155" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Direita -->
  <rect x="308" y="153" width="24" height="10" rx="2" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.2"/>
  <rect x="298" y="155" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="333" y="155" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Baixo esquerda -->
  <rect x="128" y="243" width="24" height="10" rx="2" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.2"/>
  <rect x="118" y="245" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="153" y="245" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Baixo direita -->
  <rect x="248" y="243" width="24" height="10" rx="2" fill="#0f1e3d" stroke="#00d4ff" stroke-width="1.2"/>
  <rect x="238" y="245" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="273" y="245" width="9"  height="6"  rx="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Pulso de broadcast -->
  <circle cx="200" cy="60" r="30" stroke="#00d4ff" stroke-width="1" opacity="0.25" stroke-dasharray="5 4"/>
  <circle cx="200" cy="60" r="42" stroke="#00d4ff" stroke-width="0.8" opacity="0.15" stroke-dasharray="4 5"/>
  <!-- Labels -->
  <text x="200" y="36" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="middle" opacity="0.9">EVASÃO ATIVA</text>
  <text x="200" y="282" font-family="monospace" font-size="10" fill="#a8c4e0" text-anchor="middle" opacity="0.7">Self-Healing Mesh Network</text>
  <!-- Estrelas -->
  <circle cx="30"  cy="30"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="370" cy="20"  r="1.5" fill="white" opacity="0.4"/>
  <circle cx="20"  cy="200" r="1"   fill="white" opacity="0.4"/>
  <circle cx="390" cy="250" r="1"   fill="white" opacity="0.5"/>
</svg>
